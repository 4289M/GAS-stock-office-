<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเบิกของใช้</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="app"></iframe>
  <script>
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyIRFG27kzYvThSDljekwdHR8PSd7P97HQQed1E4Q6VNYfGv3sHrV_FIqC979QkEPcoJQ/exec';
    // ส่งต่อทุกพารามิเตอร์ เช่น ?page=admin → /exec?page=admin
    document.getElementById('app').src = EXEC_URL + location.search;
  </script>
</body>
</html>
